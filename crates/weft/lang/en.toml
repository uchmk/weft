"To the end of the line" = "To the end of the line"
"To the start of the document" = "To the start of the document"
"To the end of the document" = "To the end of the document"
"Up a page" = "Up a page"
"Down a page" = "Down a page"
"Select left" = "Select left"
"Select right" = "Select right"
"Select up a line" = "Select up a line"
"Select down a line" = "Select down a line"
"Select to the start of the line" = "Select to the start of the line"
"Select to the end of the line" = "Select to the end of the line"
"Select to the start of the document" = "Select to the start of the document"
"Select to the end of the document" = "Select to the end of the document"
"Select up a page" = "Select up a page"
"Select down a page" = "Select down a page"
