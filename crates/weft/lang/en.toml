[help]
title = "Keys"
close = "Press F1 or Esc to close"
fixed = "Always"
this = "This list"
scale = "Larger / smaller"
scroll = "Scroll this list"
close_row = "Close"
clipboard = "Copy / cut / paste"

[settings]
general = "General"
general_lead = "The language, the size and the clock, shared by every uchmk app."
theme = "Theme"
theme_lead = "The colours, shared by every uchmk app."
display = "Display"
theme_note = "Your own themes go in"
no_folder = "This machine has no config folder."
sample = "A sample in this theme"
editor = "Editing"
editor_lead = "How typing works in weft's documents. Written to [editor] in weft's config.toml."
tab = "Tab"
tab_width = "Tab width"
tab_width_note = "The spaces Tab puts in, and Shift+Tab takes away from the start of the line, outside tables and lists. With several lines selected, every line goes in or out by one level. In a table they go to the next or previous cell; on a list item they indent or outdent it."
tab_char = "Insert a tab character"
tab_char_note = "Tab puts in one tab character instead of spaces. Shift+Tab takes away one tab, or up to the tab width of spaces. List items and table cells work as before."
keys = "Keys"
keys_lead = "Each operation's keys. Press a key to change one, ↺ to put the built-in ones back. Only what you change is written to keymap.toml."
notify = "Notifications"
notify_lead = "How weft tells you that a file could not be saved while its window is behind another. Written to [notify] in weft's config.toml."
tabs = "Tabs"

[notify]
open = "Open"
save_failed = "Could not save"
save_failed_sound = "Sound when a file could not be saved"
test_title = "weft: test notification"
test_body = "A file that could not be saved is told like this."

[file]
saved = "Saved {0}"
save_failed = "Could not save {0}: {1}"
no_path = "This document has no file yet: start weft with a file name to save to"
locked = "{0} is not UTF-8: it opened read-only and is not saved"
editor_failed = "Could not open the external editor: {0}"
open_failed = "Could not open {0}: {1}"
no_thread = "weft could not start its file thread: nothing can be saved"

# Quitting with changes that are not saved.
[quit]
title = "Unsaved changes"
body = "{0} has changes that are not saved."
# Several files have changes that are not saved: {0} the first, {1} how many more.
body_many = "{0} and {1} more have changes that are not saved."
save = "Save and quit"
discard = "Quit without saving"
cancel = "Cancel"
# The question as a screen reader says it: {0} title, {1} body, then the answers' names.
spoken = "{0}. {1} Enter: {2}, N: {3}, Esc: {4}"

# Closing a tab with changes that are not saved (the title, the body and
# Cancel are the quit question's).
[tab]
save = "Save and close"
discard = "Close without saving"
# Opening one more file would push out a tab whose changes are not saved: {0} the file to open, {1} the tab.
full = "Could not open {0}: the tabs are full and {1} has changes that are not saved"
# The tab of a document that has no file.
untitled = "Untitled"

# The find and replace bar (ito-find's words), and what it says when it acts.
[preview]
empty_title = "Nothing to preview"
empty_body = "Type some Markdown and it shows here."
on = "Preview on"
off = "Preview off"
contents = "Contents"

[find]
find_hint = "Find"
replace_hint = "Replace with"
regex = "Regular expression"
match_case = "Match case"
whole_word = "Whole word"
in_selection = "In selection"
next = "Next match"
prev = "Previous match"
replace = "Replace"
replace_all = "Replace all"
close = "Close"
toggle_replace = "Show or hide Replace"
no_results = "No results"
searching = "Searching…"
# {0} the number of places replaced.
replaced = "Replaced {0}"
locked = "This file cannot be changed"

# Said to a screen reader when a command does not apply at the caret.
[edit]
nothing = "{0}: nothing to do here"
# A format command put `**`, `*` or `~~` next to punctuation, where Markdown may not read it as emphasis.
unflanked = "The marks are in, but next to punctuation they may not show as emphasis"

[status]
line_col = "Ln {0}, Col {1}"
# Characters: graphemes, line breaks not counted.
chars = "Chars {0}"
selected = "Selected {0}"
# In place of the selection's count while it waits for the reading of a large text.
pending = "…"
utf8 = "UTF-8"
not_utf8 = "Not UTF-8"
# The input method is composing.
composing = "Composing"
# The input method: switched off, or on in one of its input modes (on in a
# mode not listed: Chinese, Korean, an unknown one).
ime_off = "IME off"
ime_on = "IME on"
ime_hiragana = "Hiragana"
ime_full_katakana = "Full-width katakana"
ime_half_katakana = "Half-width katakana"
ime_full_alnum = "Full-width alphanumeric"
ime_half_alnum = "Half-width alphanumeric"
lf = "LF"
crlf = "CRLF"
mixed = "Mixed line endings"
bom = "BOM"
read_only = "Read-only"
unsaved = "Unsaved"
saving = "Saving…"

