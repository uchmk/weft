# The built-in keys. A person's own keymap.toml (in the app's folder) lays over
# this. The first three are the same in every uchmk app (ito_keymap::COMMON).
# `desc` is the English text the help shows; lang/*.toml's [keydesc] translates it.
#
# [app] keys work anywhere in the window; [edit] keys only while the document
# has the keys, and are looked at first then. Copy, cut and paste (Ctrl+C,
# Ctrl+X, Ctrl+V) are the window's and cannot be bound.

# --- Common ---

[[app.keymap]]
on = "<C-,>"
run = "settings"
desc = "Open the settings"

[[app.keymap]]
on = "<F1>"
run = "help"
desc = "Show the key help"

[[app.keymap]]
on = "<C-q>"
run = "quit"
desc = "Quit"

# --- File and history ---

[[app.keymap]]
on = "<C-s>"
run = "file.save"
desc = "Save the file"

[[app.keymap]]
on = "<C-e>"
run = "file.open_in_editor"
desc = "Open in the external editor at the caret"

[[app.keymap]]
on = "<C-z>"
run = "edit.undo"
desc = "Undo"

[[app.keymap]]
on = "<C-y>"
run = "edit.redo"
desc = "Redo"

[[app.keymap]]
on = "<C-S-z>"
run = "edit.redo"
desc = "Redo"

# --- Tabs ---
#
# Ctrl+Shift+Tab is written `<C-S-Tab>`. Alt+N goes to tab N; Alt+Shift+N
# (`<A-S-5>`) is another key.

[[app.keymap]]
on = "<C-Tab>"
run = "tab.next"
desc = "Next tab"

[[app.keymap]]
on = "<C-PageDown>"
run = "tab.next"
desc = "Next tab"

[[app.keymap]]
on = "<C-S-Tab>"
run = "tab.prev"
desc = "Previous tab"

[[app.keymap]]
on = "<C-PageUp>"
run = "tab.prev"
desc = "Previous tab"

[[app.keymap]]
on = "<C-w>"
run = "tab.close"
desc = "Close the tab"

[[app.keymap]]
on = "<A-1>"
run = "tab.goto_1"
desc = "Go to tab 1"

[[app.keymap]]
on = "<A-2>"
run = "tab.goto_2"
desc = "Go to tab 2"

[[app.keymap]]
on = "<A-3>"
run = "tab.goto_3"
desc = "Go to tab 3"

[[app.keymap]]
on = "<A-4>"
run = "tab.goto_4"
desc = "Go to tab 4"

[[app.keymap]]
on = "<A-5>"
run = "tab.goto_5"
desc = "Go to tab 5"

[[app.keymap]]
on = "<A-6>"
run = "tab.goto_6"
desc = "Go to tab 6"

[[app.keymap]]
on = "<A-7>"
run = "tab.goto_7"
desc = "Go to tab 7"

[[app.keymap]]
on = "<A-8>"
run = "tab.goto_8"
desc = "Go to tab 8"

[[app.keymap]]
on = "<A-9>"
run = "tab.goto_9"
desc = "Go to tab 9"

# --- Find and replace ---
#
# Enter in the bar steps to the next match (Shift+Enter the previous); Enter in
# the Replace field replaces; Esc closes the bar.

[[app.keymap]]
on = "<C-S-m>"
run = "view.toggle_preview"
desc = "Toggle the preview"

[[app.keymap]]
on = "<A-S-v>"
run = "edit.paste_image"
desc = "Paste the clipboard picture"

[[app.keymap]]
on = "<A-z>"
run = "view.toggle_wrap"
desc = "Toggle word wrap"

[[app.keymap]]
on = "<C-f>"
run = "find.open"
desc = "Find"

[[app.keymap]]
on = "<C-h>"
run = "replace.open"
desc = "Find and replace"

[[app.keymap]]
on = "<F3>"
run = "find.next"
desc = "Next match"

[[app.keymap]]
on = "<S-F3>"
run = "find.prev"
desc = "Previous match"

[[app.keymap]]
on = "<A-Enter>"
run = "replace.one"
desc = "Replace this match"

[[app.keymap]]
on = "<A-f>"
run = "heading.fold"
desc = "Fold or unfold this section"

[[app.keymap]]
on = "<A-S-f>"
run = "view.focus"
desc = "Show only this section"

[[app.keymap]]
on = "<C-S-Enter>"
run = "link.follow"
desc = "Open the linked note"

[[app.keymap]]
on = "<C-S-f>"
run = "vault.search"
desc = "Search every note"

[[app.keymap]]
on = "<C-S-b>"
run = "vault.backlinks"
desc = "Show the notes that link here"

[[app.keymap]]
on = "<F8>"
run = "lint.next"
desc = "Next lint finding"

[[app.keymap]]
on = "<S-F8>"
run = "lint.prev"
desc = "Previous lint finding"

[[app.keymap]]
on = "<C-A-Enter>"
run = "replace.all"
desc = "Replace all"

