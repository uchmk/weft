# Tab and Shift+Tab: every line of a selection over several lines one level in
# or out; else the next or previous cell in a table, the list item one level
# in or out, and anywhere else a tab or the tab width of spaces (the settings).

[[edit.keymap]]
on = "<Tab>"
run = "edit.tab"
desc = "Next cell, indent the item or the lines, or put in a tab"

[[edit.keymap]]
on = "<S-Tab>"
run = "edit.untab"
desc = "Previous cell, outdent the item or the lines, or take a tab away"

# --- Formatting ---
#
# A shifted symbol is written as the symbol it types: `<C-{>` is Ctrl+Shift+[.
# On a JIS keyboard Ctrl+Shift+@ arrives as `<C-`>` and Ctrl+@ as `<C-[>`.
# Pressing a heading's key on a heading of that level makes it a paragraph.
# An Alt key never types its character. A digit keeps its Shift: `<A-S-5>` is
# Alt+Shift+5 and `<A-5>` is Alt+5, two keys; Ctrl+Shift+1 is `<C-S-1>`.

[[edit.keymap]]
on = "<C-b>"
run = "inline.bold"
desc = "Toggle bold"

[[edit.keymap]]
on = "<C-i>"
run = "inline.italic"
desc = "Toggle italic"

[[edit.keymap]]
on = "<C-`>"
run = "inline.code"
desc = "Toggle inline code"

[[edit.keymap]]
on = "<A-S-5>"
run = "inline.strike"
desc = "Toggle strikethrough"

[[edit.keymap]]
on = "<C-k>"
run = "inline.link"
desc = "Toggle a link"

[[edit.keymap]]
on = "<C-1>"
run = "heading.set_1"
desc = "Toggle heading 1"

[[edit.keymap]]
on = "<C-2>"
run = "heading.set_2"
desc = "Toggle heading 2"

[[edit.keymap]]
on = "<C-3>"
run = "heading.set_3"
desc = "Toggle heading 3"

[[edit.keymap]]
on = "<C-4>"
run = "heading.set_4"
desc = "Toggle heading 4"

[[edit.keymap]]
on = "<C-5>"
run = "heading.set_5"
desc = "Toggle heading 5"

[[edit.keymap]]
on = "<C-6>"
run = "heading.set_6"
desc = "Toggle heading 6"

[[edit.keymap]]
on = "<C-[>"
run = "block.fence"
desc = "Toggle the code block"

[[edit.keymap]]
on = "<A-q>"
run = "block.quote"
desc = "Toggle the quote"

[[edit.keymap]]
on = "<C-}>"
run = "list.bullet"
desc = "Toggle the bulleted list"

[[edit.keymap]]
on = "<C-{>"
run = "list.number"
desc = "Toggle the numbered list"

[[edit.keymap]]
on = "<A-t>"
run = "list.task"
desc = "Toggle the task list"

[[edit.keymap]]
on = "<A-x>"
run = "list.check_tasks"
desc = "Check the selected tasks"

[[edit.keymap]]
on = "<A-S-x>"
run = "list.uncheck_tasks"
desc = "Uncheck the selected tasks"
