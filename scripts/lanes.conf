# weft's values for the lanes' shared scripts (scripts/lanes.sh): the
# scripts are the same bytes in every uchmk app and read what differs from
# here. kura's scripts/lanes.conf says what each key is for.
app=weft
crate=weft
bin=weft
keys_env=WEFT_KEYS_DONE
state=weft-wintest
todo_marks=【人】 【金】 【実機】 要確認
# weft takes the ito-first check and its lists, not the test lanes' scripts
# (add the names when the app gets those lanes).
files=lanes.sh ito-first.py ito-first.txt ito-required.txt release-sums.sh
# The workflows written from ito's templates by lanes.sh sync (audit.yml and ci.yml are the app's own).
workflows=build.yml arm64.yml checklists.yml release.yml release-sums.yml
